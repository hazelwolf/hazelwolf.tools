[project]
name = "voicestudio-service"
version = "0.1.0"
description = "API + MCP wrapper around VoiceStudio (voice cloning, voice design, TTS in 646 languages, transcription)"
readme = "README.md"
# Upstream pins Python 3.11 (.python-version) and ships cp311 wheels for its native deps.
requires-python = ">=3.11,<3.12"
dependencies = [
    "omnivoice",
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "mcp>=1.28.1,<2",
    "httpx>=0.28.1",
    "python-dotenv",
    "python-multipart",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
voicestudio-backend = "voicestudio_service.backend:main"
voicestudio-api = "voicestudio_service.api:main"
voicestudio-mcp = "voicestudio_service.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicestudio_service"]

[tool.uv.sources]
omnivoice = { path = "upstream", editable = true }

# Upstream's own [tool.uv] settings do not apply to a path dependency; mirror its pins so the
# resolved stack matches what VoiceStudio tests against. macOS uses the PyPI torch build (MPS).
[tool.uv]
constraint-dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "mako>=1.3.12",
    "msgpack>=1.2.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "starlette>=1.3.1",
]
