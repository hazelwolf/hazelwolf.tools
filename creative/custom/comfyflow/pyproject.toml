[project]
name = "comfyflow-tool"
version = "0.1.0"
description = "Thin API, CLI and MCP wrapper that runs ComfyUI workflows (API format) with named parameters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
comfyflow = "comfyflow_tool.cli:main"
comfyflow-api = "comfyflow_tool.api:main"
comfyflow-mcp = "comfyflow_tool.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyflow_tool"]
