[project]
name = "zimage-service"
version = "0.1.0"
description = "API + MCP wrapper around Z-Image-Turbo (Tongyi-MAI) running natively on Apple Silicon via mflux (MLX)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mflux",
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "mcp>=1.28.1,<2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "httpx>=0.28.1"]

[project.scripts]
zimage-prepare = "zimage_service.prepare:main"
zimage-api = "zimage_service.api:main"
zimage-mcp = "zimage_service.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zimage_service"]

[tool.uv.sources]
mflux = { path = "upstream", editable = true }

# Upstream's own [tool.uv] settings and lock do not apply to a path dependency. Pillow 13 imports
# numbers._IntegralLike, which CPython 3.13 does not have, so hold it at upstream's locked 12.3.
[tool.uv]
constraint-dependencies = ["pillow>=12.3.0,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
