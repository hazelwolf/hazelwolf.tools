[project]
name = "sensenova-u1-service"
version = "0.1.0"
description = "API + MCP wrapper around SenseNova-U1 / U1.5 (text-to-image and infographic generation)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sensenova-u1",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.2,<2",
    "python-dotenv",
    "pillow",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
sensenova-u1-api = "sensenova_u1_service.api:main"
sensenova-u1-mcp = "sensenova_u1_service.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensenova_u1_service"]

[tool.uv.sources]
sensenova-u1 = { path = "upstream", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# Same CUDA 12.8 wheels the upstream reference environment uses (covers Blackwell sm_120).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
