[project]
name = "ltx-service"
version = "0.1.0"
description = "API + MCP wrapper around LTX-2.5 (Lightricks) text/image-to-video with audio, running natively on Apple Silicon via ltx-2-mlx (MLX)"
readme = "README.md"
# Upstream pins Python 3.11 (.python-version) and tests against it.
requires-python = ">=3.11,<3.12"
dependencies = [
    "ltx-core-mlx",
    "ltx-pipelines-mlx",
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "mcp>=1.28.1,<2",
    "python-dotenv",
    "python-multipart",
    "filelock",
]

[dependency-groups]
dev = ["pytest", "httpx>=0.28.1"]

[project.scripts]
ltx-prepare = "ltx_service.prepare:main"
ltx-api = "ltx_service.api:main"
ltx-mcp = "ltx_service.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltx_service"]

# Upstream is a uv workspace; we depend on its two inference packages as path dependencies.
[tool.uv.sources]
ltx-core-mlx = { path = "upstream/packages/ltx-core-mlx", editable = true }
ltx-pipelines-mlx = { path = "upstream/packages/ltx-pipelines-mlx", editable = true }

# Upstream's lock does not apply to path dependencies; mirror the pins it is tested against.
# Pillow 13 imports numbers._IntegralLike, which this CPython does not have.
[tool.uv]
constraint-dependencies = [
    "mlx==0.32.2",
    "mlx-lm==0.31.1",
    "mlx-arsenal==0.2.4",
    "pillow>=12.1.1,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
