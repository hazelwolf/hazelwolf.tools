<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Eval Review</title>
<style>
:root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#2563eb; --pick:#16a34a; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524; --accent:#60a5fa; --pick:#4ade80; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line);
  padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:15px; margin:0; font-weight:600; }
.progress { color:var(--muted); font-variant-numeric:tabular-nums; }
.spacer { flex:1; }
button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card);
  color:var(--fg); cursor:pointer; }
button:hover { border-color:var(--accent); }
button.on { border-color:var(--pick); color:var(--pick); }
main { max-width:1500px; margin:0 auto; padding:16px; }
.meta { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-bottom:4px; }
.tag { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.prompt { font-size:18px; margin:4px 0 2px; }
.check { color:var(--muted); margin:0 0 12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px; }
figure { margin:0; background:var(--card); border:2px solid var(--line); border-radius:10px; overflow:hidden;
  cursor:pointer; position:relative; }
figure.picked { border-color:var(--pick); }
figure img { display:block; width:100%; height:auto; }
figcaption { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.65); color:#fff; border-radius:6px;
  padding:2px 9px; font-weight:600; }
.actions { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
.hint { color:var(--muted); font-size:13px; }
table { border-collapse:collapse; margin:10px 0 24px; width:100%; }
th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; }
#results { display:none; }
#results.show { display:block; }
.reveal { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Image eval, blind review</h1>
  <span class="progress" id="progress"></span>
  <span class="spacer"></span>
  <button id="next-open">Next unvoted</button>
  <button id="export">Export votes.json</button>
  <button id="reveal">Reveal results</button>
</header>
<main>
  <section id="review"></section>
  <section id="results"></section>
</main>
<script>
const DATA = __DATA__;
const KEY = "imgeval:" + DATA.run;
const LETTERS = "ABCDEFGH";
let votes = {};
try { votes = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let idx = 0;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(votes)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render() {
  const n = DATA.items.length, done = DATA.items.filter(i => votes[i.id]).length;
  document.getElementById("progress").textContent = n ? `${idx + 1} / ${n} · ${done} voted` : "no comparisons";
  if (!n) return;
  const it = DATA.items[idx], v = votes[it.id];
  const figs = it.images.map((im, i) => `
    <figure data-model="${im.model}" class="${v === im.model ? "picked" : ""}">
      <img src="${esc(im.src)}" alt="Option ${LETTERS[i]}" loading="eager">
      <figcaption>${LETTERS[i]}</figcaption>
    </figure>`).join("");
  document.getElementById("review").innerHTML = `
    <div class="meta"><span class="tag">${esc(it.category)}</span><span class="tag">${esc(it.prompt_id)} · seed ${it.seed}</span></div>
    <p class="prompt">${esc(it.text)}</p>
    ${it.check ? `<p class="check">Look for: ${esc(it.check)}</p>` : ""}
    <div class="grid">${figs}</div>
    <div class="actions">
      <button id="prev">← Prev</button>
      <button id="tie" class="${v === "tie" ? "on" : ""}">Tie (0)</button>
      <button id="bad" class="${v === "bad" ? "on" : ""}">All bad (X)</button>
      <button id="next">Next →</button>
    </div>
    <p class="hint">Click the best image, or press ${it.images.map((_, i) => i + 1).join("/")}. Arrow keys move between comparisons.</p>`;
  document.querySelectorAll("figure").forEach(f => f.onclick = () => vote(f.dataset.model));
  document.getElementById("prev").onclick = () => go(-1);
  document.getElementById("next").onclick = () => go(1);
  document.getElementById("tie").onclick = () => vote("tie");
  document.getElementById("bad").onclick = () => vote("bad");
}
function go(d) { idx = Math.max(0, Math.min(DATA.items.length - 1, idx + d)); render(); window.scrollTo(0, 0); }
function vote(choice) {
  votes[DATA.items[idx].id] = choice; save();
  if (idx < DATA.items.length - 1) go(1); else render();
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const it = DATA.items[idx]; if (!it) return;
  const k = parseInt(e.key, 10);
  if (k >= 1 && k <= it.images.length) vote(it.images[k - 1].model);
  else if (e.key === "0") vote("tie");
  else if (e.key === "x" || e.key === "X") vote("bad");
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});
document.getElementById("next-open").onclick = () => {
  const n = DATA.items.length;
  for (let s = 1; s <= n; s++) { const j = (idx + s) % n; if (!votes[DATA.items[j].id]) { idx = j; render(); return; } }
};
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify({run: DATA.run, votes}, null, 2)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "votes.json"; a.click();
};
document.getElementById("reveal").onclick = () => {
  const box = document.getElementById("results");
  if (box.classList.toggle("show")) { renderResults(); box.scrollIntoView({behavior: "smooth"}); }
};
function renderResults() {
  const keys = DATA.stats.map(s => s.model), label = Object.fromEntries(DATA.stats.map(s => [s.model, s.label]));
  const cats = [...new Set(DATA.items.map(i => i.category))];
  const count = (pred) => { const c = Object.fromEntries([...keys, "tie", "bad"].map(k => [k, 0]));
    DATA.items.filter(pred).forEach(i => { const v = votes[i.id]; if (v in c) c[v]++; }); return c; };
  const all = count(() => true), per = Object.fromEntries(cats.map(c => [c, count(i => i.category === c)]));
  const rowsFor = [...keys, "tie", "bad"].map(k => `<tr><td>${esc(label[k] || k)}</td><td>${all[k]}</td>${cats.map(c => `<td>${per[c][k]}</td>`).join("")}</tr>`).join("");
  const stats = DATA.stats.map(s => `<tr><td>${esc(s.label)}</td><td>${s.steps}</td><td>${s.median_s ?? "–"}</td><td>${s.load_s ?? "–"}</td><td>${s.peak_gb ?? "–"}</td><td>${s.images}</td><td>${esc(s.license)}${s.commercial ? "" : " ⚠"}</td></tr>`).join("");
  const st = DATA.settings;
  document.getElementById("results").innerHTML = `
    <h2>Wins</h2>
    <p class="reveal">${Object.keys(votes).length} of ${DATA.items.length} comparisons voted.</p>
    <table><tr><th>Model</th><th>Total</th>${cats.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${rowsFor}</table>
    <h2>Speed and memory</h2>
    <p class="reveal">${st.width}×${st.height}, ${st.quantize ? st.quantize + "-bit" : "bf16"}, seeds ${st.seeds.join(", ")}. Seconds are the median per image; peak memory is MLX's peak for the whole process.</p>
    <table><tr><th>Model</th><th>Steps</th><th>s / image</th><th>Load s</th><th>Peak GB</th><th>Images</th><th>Weights license</th></tr>${stats}</table>`;
}
render();
</script>
</body>
</html>
